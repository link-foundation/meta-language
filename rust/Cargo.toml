[lib]
name = "meta_language"
path = "src/lib.rs"

[[bin]]
name = "meta-language"
path = "src/main.rs"

[[bench]]
name = "competitor_bench"
path = "benches/competitor_bench.rs"
harness = false

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
doublets = { version = "0.5.0", optional = true }
indexmap = "=2.14.2"
lindera = { version = "6.2.0", default-features = false, features = ["embed-jieba"], optional = true }
lingua = { version = "1.8.0", default-features = false, features = [
    "arabic",
    "bengali",
    "chinese",
    "english",
    "french",
    "hindi",
    "portuguese",
    "russian",
    "spanish",
    "urdu",
] }
links-notation = { version = "0.22.0", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
platform-mem = { version = "0.3.0", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tree-sitter = "=0.27.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-elixir = "=0.3.5"
tree-sitter-elm = "=5.9.4"
tree-sitter-haskell = "=0.24.1"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-matlab = "=1.3.1"
tree-sitter-md-025 = "=0.5.6"
tree-sitter-ocaml = "=0.26.0"
ts-parser-perl = "=2.0.0"
tree-sitter-php = "=0.24.2"
tree-sitter-ruby = "=0.23.1"
tree-sitter-language = "0.1.8"
tree-sitter-scala = "=0.26.2"
tree-sitter-swift = "=0.7.4"
tree-sitter-yaml = "=0.7.2"
unicode-bidi = "0.3.18"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
whatlang = "0.18.0"

[features]
default = ["lindera"]
doublets = ["dep:doublets", "dep:platform-mem"]
lindera = ["dep:lindera"]
llm-assist = []

[package.metadata.docs.rs]
no-default-features = true

[dev-dependencies]
agda-layout-source-oracle = { path = "oracles/agda-layout-source-oracle" }
tree-sitter-agda = "=1.3.3"
tree-sitter-html = "=0.23.2"
tree-sitter-odin = "=1.3.0"
tree-sitter-xml = "=0.7.0"
tree-sitter-r = "=1.3.0"
tree-sitter-hcl = "=1.1.0"
native-source-oracles = { path = "oracles/native-source-oracles" }
tree-sitter-python = "=0.25.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-nix = "=0.3.0"
cmake-source-oracle = { path = "oracles/cmake-source-oracle" }
tree-sitter-cpp = "=0.23.4"
tree-sitter-sequel = "=0.3.11"
tree-sitter-groovy = "=0.1.2"
tree-sitter-erlang = "=0.20.0"
tree-sitter-powershell = "=0.26.4"
tree-sitter-css = "=0.25.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-pascal = "=0.10.2"
tree-sitter-vb-dotnet = "=0.1.0"
links-notation = { version = "0.22.0", default-features = false }
pest = "2.8.6"
pest_derive = "2.8.6"
pest_meta = "2.8.6"
regex = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
tree-sitter-c = "=0.24.2"
tree-sitter-diff = "=0.1.0"
tree-sitter-go = "=0.25.0"
tree-sitter-graphql = "=0.3.0"
tree-sitter-ini = "=1.4.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-json5-orchard = "=0.1.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-make = "=1.1.1"
tree-sitter-proto = "=0.6.0"
tree-sitter-racket = "=0.25.0"
tree-sitter-regex = "=0.25.0"
tree-sitter-scheme = "=0.24.7"
tree-sitter-solidity = "=1.2.13"
tree-sitter-typescript = "=0.23.2"
walkdir = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# The merge quality measurement counts heap bytes with a global allocator,
# so it is a binary of its own.
[[test]]
name = "merge_quality"
path = "tests/merge_quality.rs"

# Lean debug and test builds (docs/cache-cleanup.md): line tables keep
# backtraces readable at a fraction of the size, and incremental state is not
# kept, since it is the largest part of a debug target. `[profile.test]`
# inherits both settings.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true
