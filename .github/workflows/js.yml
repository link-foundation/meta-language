  # Keep packaging, secret scanning and the final dependency gate after all
  # required checks, while still reporting each failure independently.
  test:
    name: JavaScript Package
    needs: [tests, report-assertions, package-checks, translation-test-feedback]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-js-${{ github.ref }}-javascript-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Provision the pinned external grammar check inputs
        run: node js/scripts/external-grammar-cache.mjs --all --materialize

      - name: Check that every test file is in exactly one test group
        run: node scripts/test-groups.mjs --check
        working-directory: js

      - name: Check the cache cleanup policy
        if: ${{ !cancelled() }}
        run: node scripts/check-cache-policy.mjs

      - name: Install and verify the development hook in this clone
        if: ${{ !cancelled() }}
        run: |
          node scripts/install-dev-hooks.mjs
          node scripts/install-dev-hooks.mjs --check

      - name: Check Rust/JavaScript parity manifest
        if: ${{ !cancelled() }}
        run: npm run check:parity
        working-directory: js

      - name: Check that every JavaScript export maps to a public Rust item
        if: ${{ !cancelled() }}
        run: npm run check:export-parity
        working-directory: js

      - name: Verify npm package contents
        if: ${{ !cancelled() }}
        run: node ../scripts/with-cache-cleanup.mjs --event package -- npm pack --dry-run
        working-directory: js

      - name: Scan repository for secrets
        if: ${{ !cancelled() }}
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

      - name: Require every JavaScript test group
        if: ${{ !cancelled() }}
        env:
          PACKAGE_CHECKS_RESULT: ${{ needs.package-checks.result }}
          TRANSLATION_FEEDBACK_RESULT: ${{ needs.translation-test-feedback.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          REPORTS_RESULT: ${{ needs.report-assertions.result }}
          EXTERNAL_REPORTS: ${{ inputs.external_reports }}
        run: |
          if [ "$PACKAGE_CHECKS_RESULT" != "success" ]; then
            echo "::error::JavaScript package check groups finished with '$PACKAGE_CHECKS_RESULT'; see the JavaScript Package Checks jobs."
            exit 1
          fi
          if [ "$TRANSLATION_FEEDBACK_RESULT" != "success" ]; then
            echo "::error::Translation feedback merge finished with '$TRANSLATION_FEEDBACK_RESULT'; see the Translation Test Feedback job."
            exit 1
          fi
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "::error::JavaScript test groups finished with '$TESTS_RESULT'; see the JavaScript Tests jobs."
            exit 1
          fi
          if [ "$EXTERNAL_REPORTS" != "true" ] && [ "$REPORTS_RESULT" != "success" ]; then
            echo "::error::Self-translation report assertions finished with '$REPORTS_RESULT'."
            exit 1
          fi

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  publish:
    name: Publish npm Package
    needs: test
    if: |
      !cancelled() && needs.test.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'release' && github.event.action == 'published')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-${{ github.repository }}-main-write
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      REQUESTED_VERSION: ${{ github.event.inputs.release_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@12
          npm --version

      - name: Verify the tagged npm and crate release identity
        id: package
        run: node scripts/release-publication.mjs --identity
        working-directory: js

      - name: Check matching registry artifacts before publication
        id: npm
        run: node scripts/release-publication.mjs --preflight
        working-directory: js

      - name: Install the linked grammar manifest reader dependencies
        if: steps.npm.outputs.already_published != 'true'
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Provision the pinned package grammar binaries
        if: steps.npm.outputs.already_published != 'true'
        run: node js/scripts/external-grammar-cache.mjs --group wasm --materialize

      # actions/setup-node writes `_authToken=${NODE_AUTH_TOKEN}` and exports the
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX` whenever no token is supplied. npm
      # then skips the OIDC exchange and the registry rejects the anonymous PUT
      # with a misleading `E404`. Strip that placeholder so trusted publishing is
      # actually attempted; keep it when a real NPM_TOKEN bootstrap secret exists.
      # See actions/setup-node#1551 and issue #191.
      - name: Prepare npm authentication
        id: npm_auth
        if: steps.npm.outputs.already_published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: meta-language
          PUBLISH_WORKFLOW_FILE: .github/workflows/js.yml
          # Set to '1' (or add --verbose) to trace npm credential resolution.
          NPM_AUTH_DEBUG: ${{ vars.NPM_AUTH_DEBUG }}
        run: node scripts/prepare-npm-auth.mjs
        working-directory: js

      # npm treats a refused trusted-publisher exchange as "no credential" and
      # reports only ENEEDAUTH. Perform the same exchange first so the log shows
      # the registry's answer, the OIDC claims it compared, and the exact
      # settings docs/ci-cd/npm-trusted-publishing.md asks for.
      - name: Verify the trusted-publisher exchange
        if: steps.npm.outputs.already_published != 'true' && steps.npm_auth.outputs.auth_mode == 'oidc'
        env:
          PACKAGE_NAME: meta-language
          PUBLISH_WORKFLOW_FILE: .github/workflows/js.yml
        run: node scripts/prepare-npm-auth.mjs --verify-exchange
        working-directory: js

      - name: Publish to npm
        if: steps.npm.outputs.already_published != 'true'
        # Optional NPM_TOKEN bootstrap fallback. OIDC trusted publishing is the
        # steady-state mechanism; the token path only matters until a trusted
        # publisher is configured for the package on npmjs.com.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
        working-directory: js

      - name: Explain npm publish failure
        if: failure() && steps.npm.outputs.already_published != 'true'
        env:
          AUTH_MODE: ${{ steps.npm_auth.outputs.auth_mode }}
        run: |
          echo "::error::npm publish failed with auth mode '$AUTH_MODE'."
          if [ "$AUTH_MODE" = "oidc" ]; then
            echo "An E404 on PUT or an ENEEDAUTH means the registry treated the request as"
            echo "anonymous. The trusted publisher of meta-language on npmjs.com must name"
            echo "${{ github.repository }} and the workflow filename js.yml with no environment;"
            echo "see docs/ci-cd/npm-trusted-publishing.md. An NPM_TOKEN secret bootstraps the publish."
          fi

      - name: Verify published package
        run: node scripts/release-publication.mjs --published
        working-directory: js

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown
