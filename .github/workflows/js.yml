name: JavaScript

# .github/workflows/ci.yml calls this workflow on pushes to main and on pull
# requests, before the Rust workflow, so the Rust jobs run only after the
# JavaScript jobs pass. A release and a manual dispatch run it standalone, so
# the npm trusted publisher stays this file.
on:
  workflow_call:
    inputs:
      external_reports:
        description: 'The caller produces and validates the complete self-translation report artifacts'
        required: false
        default: false
        type: boolean
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Expected package version (optional safety check)'
        required: false
        type: string

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older runs. Push,
# release and dispatch runs each get their own group, so a release is never
# cancelled; the write jobs also share the release queue below. The group has
# its own literal prefix: called from ci.yml, github.workflow names the caller,
# and a group equal to the caller's would deadlock with it.
concurrency:
  group: js-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Standalone release/dispatch runs produce the same report artifacts as CI.
  # ci.yml supplies its existing parallel shards and validates them separately.
  reports:
    name: Self-Translation Report (${{ matrix.shard }}/8)
    if: ${{ !inputs.external_reports }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Report self-translation against the hand-written Rust
        env:
          META_LANGUAGE_REPORT_PROGRESS: '1'
        run: |
          node scripts/generate-self-translation-report.mjs --shard ${{ matrix.shard }}/8 --out-dir ../self-translation-report > /dev/null
          cat ../self-translation-report/self-translation-report.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: js

      - name: Upload the self-translation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: self-translation-report-${{ github.sha }}-${{ matrix.shard }}
          path: self-translation-report
          if-no-files-found: error

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  report-assertions:
    name: Self-Translation Report Assertions
    needs: reports
    if: ${{ !cancelled() && !inputs.external_reports }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Download the complete self-translation reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: self-translation-report-${{ github.sha }}-*
          path: issue-195-artifacts/self-translation-report

      - name: Run the report artifact test group
        if: ${{ !cancelled() }}
        env:
          ISSUE_195_SELF_TRANSLATION_REPORT_DIRECTORY: ${{ github.workspace }}/issue-195-artifacts/self-translation-report
        run: node ../scripts/with-cache-cleanup.mjs --event test -- node scripts/test-groups.mjs --run report-artifacts
        working-directory: js

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # The test files run in groups, one job each, so no job holds the whole
  # suite in one process. scripts/test-groups.mjs fails when a test file is in
  # no group or in more than one.
  tests:
    name: JavaScript Tests (${{ matrix.group }}, ${{ matrix.partition }}/${{ matrix.shards || 1 }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-js-${{ github.ref }}-javascript-tests-${{ matrix.group }}-${{ matrix.partition }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        group: [grammar, grammar-native, grammar-recovery, grammar-scaling, grammar-csharp, grammar-elixir, grammar-ruby, translation, conformance, downstream, tooling]
        partition: [1]
        include:
          - {group: grammar, partition: 1, shards: 3}
          - {group: grammar, partition: 2, shards: 3}
          - {group: grammar, partition: 3, shards: 3}
          - {group: grammar-native, partition: 1, shards: 3}
          - {group: grammar-native, partition: 2, shards: 3}
          - {group: grammar-native, partition: 3, shards: 3}
          - {group: conformance, partition: 1, shards: 2}
          - {group: conformance, partition: 2, shards: 2}
          - {group: translation, partition: 1, shards: 3}
          - {group: translation, partition: 2, shards: 3}
          - {group: translation, partition: 3, shards: 3}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Provision the pinned external grammar test inputs
        run: node js/scripts/external-grammar-cache.mjs --all --materialize

      - name: Build the independently corrected Agda layout oracle
        if: contains(fromJSON('["grammar", "grammar-native", "grammar-recovery"]'), matrix.group)
        run: node scripts/build-agda-layout-oracle.mjs
        working-directory: js

      - name: Setup Rust for translation behavior and generated-code checks
        if: matrix.group == 'translation'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # A short-lived, reproducible workspace snapshot makes parser failures
      # locally debuggable without changing the grammar assertions.
      - name: Pack issue 199 debugging workspace
        if: matrix.group == 'tooling'
        run: tar -czf /tmp/issue-199-workspace.tgz --exclude=.git --exclude=node_modules/.cache .

      - name: Export issue 199 debugging workspace
        if: matrix.group == 'tooling'
        uses: actions/upload-artifact@v7
        with:
          name: issue-199-workspace
          path: /tmp/issue-199-workspace.tgz
          retention-days: 1
          if-no-files-found: error

      - name: Run the test group
        if: ${{ !cancelled() }}
        env:
          TEST_GROUP: ${{ matrix.group }}
          TEST_GROUP_SHARD: ${{ matrix.partition }}/${{ matrix.shards || 1 }}
          TRANSLATION_CHECK_RUST: ${{ matrix.group == 'translation' && '1' || '0' }}
          SELF_TRANSLATION_CHECK_RUST: ${{ matrix.group == 'translation' && '1' || '0' }}
        run: node ../scripts/with-cache-cleanup.mjs --event test -- node scripts/test-groups.mjs --run "$TEST_GROUP"
        working-directory: js

      - name: Capture translation compiler feedback partition
        if: ${{ !cancelled() && matrix.group == 'translation' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          TRANSLATION_SHARD: ${{ matrix.partition }}/${{ matrix.shards }}
        run: >-
          node js/scripts/translation-test-feedback.mjs capture
          --commit "$GITHUB_SHA" --shard "$TRANSLATION_SHARD"
          --out "issue-195-artifacts/translation-test-feedback/${{ matrix.partition }}-of-${{ matrix.shards }}"

      - name: Retain translation compiler feedback and native observations
        if: ${{ !cancelled() && matrix.group == 'translation' }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-test-feedback-${{ github.sha }}-${{ matrix.partition }}-of-${{ matrix.shards }}
          path: |
            issue-195-artifacts/translation-test-feedback/${{ matrix.partition }}-of-${{ matrix.shards }}/translation-test-feedback-partition.lino
            issue-195-artifacts/translation-test-feedback/${{ matrix.partition }}-of-${{ matrix.shards }}/issue-195-artifacts/compiler-feedback
            issue-195-artifacts/translation-test-feedback/${{ matrix.partition }}-of-${{ matrix.shards }}/issue-195-results/artifacts/decimal-format-draft-native.lino
          retention-days: 7
          if-no-files-found: error

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  translation-test-feedback:
    name: Translation Test Feedback
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-js-${{ github.ref }}-translation-test-feedback
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install the linked receipt reader
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download every translation feedback partition separately
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: translation-test-feedback-${{ github.sha }}-*-of-3
          path: .issue-195-work/translation-test-feedback/partitions
          merge-multiple: false

      - name: Merge exact-commit translation feedback without overwriting conflicts
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p .issue-195-work/translation-test-feedback
          node js/scripts/translation-test-feedback.mjs merge \
            --commit "$GITHUB_SHA" \
            --inputs .issue-195-work/translation-test-feedback/partitions \
            --out .issue-195-work/translation-test-feedback/merged \
            2>&1 | tee .issue-195-work/translation-test-feedback/merge.log

      - name: Retain the complete original translation feedback artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-test-feedback-${{ github.sha }}
          path: .issue-195-work/translation-test-feedback/merged/
          retention-days: 7
          if-no-files-found: error

      - name: Retain translation feedback merge diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: translation-test-feedback-merge-diagnostics-${{ github.sha }}
          path: .issue-195-work/translation-test-feedback/merge.log
          retention-days: 7
          if-no-files-found: error

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # Separate the native import and oracle fixture costs from other package
  # checks. Every group is required; a failure never cancels its siblings.
  package-checks:
    name: JavaScript Package Checks (${{ matrix.group }})${{ matrix.generated_slice == 'second' && ' / second' || '' }}
    needs: [tests, report-assertions]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-js-${{ github.ref }}-javascript-package-checks-${{ matrix.group }}-${{ matrix.generated_slice }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        group: [native-imports, native-fixtures, grammar, contracts, generated, source-models]
        generated_slice: [first]
        include:
          - group: generated
            generated_slice: second
          - group: source-model-tables
            generated_slice: first
          - group: binary-candidates
            generated_slice: first
          - group: source-model-raw
            generated_slice: first
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Simulate fresh merge with base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash js/scripts/simulate-fresh-merge.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Provision the pinned external grammar check inputs
        run: node js/scripts/external-grammar-cache.mjs --all --materialize

      - name: Check grammar-derived default CST expectations
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:default-cst
        working-directory: js

      - name: Check the official links-notation LiNo grammar cases
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:lino-grammar
        working-directory: js

      - name: Check the pdf-lib PDF grammar cases
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:pdf-grammar
        working-directory: js

      - name: Check the native grammars imported from their pinned sources
        if: ${{ !cancelled() && matrix.group == 'native-imports' }}
        run: npm run check:native-imports
        working-directory: js

      - name: Check shared source prefix operand precedence fixtures
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-grammar-prefix-operand-fixtures.mjs --check
        working-directory: js

      - name: Check the pinned Ruby pattern fixtures against their independent oracle
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-ruby-pattern-fixture.mjs --check
        working-directory: js

      - name: Check the pinned Ruby expression syntax fixtures against their independent oracle
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-ruby-expression-syntax-fixture.mjs --check
        working-directory: js

      - name: Check the pinned Ruby heredoc call fixtures against their independent oracle
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-ruby-heredoc-fixture.mjs --check
        working-directory: js

      - name: Check the pinned Ruby method declaration fixtures against their independent oracle
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-ruby-heredoc-fixture.mjs --fixture ruby-method-declaration-context-ci --check
        working-directory: js

      - name: Check the pinned Ruby literal CI fixtures against their independent oracle
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node scripts/generate-ruby-literal-ci-regressions.mjs --check
        working-directory: js

      - name: Check the native merged grammar fixtures against their oracles
        if: ${{ !cancelled() && matrix.group == 'native-fixtures' }}
        run: npm run check:native-grammars
        working-directory: js

      - name: Check the independent built-in grammar CST expectations
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:builtin-cst
        working-directory: js

      - name: Check the shared language catalog
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:language-catalog
        working-directory: js

      - name: Check the shared concept records
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:concept-records
        working-directory: js

      - name: Check the native grammar concept reuse report
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:concept-reuse
        working-directory: js

      - name: Check the native grammar merge quality evidence
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: npm run check:merge-quality
        working-directory: js

      - name: Run grammar conversion cycles under the actual Peggy target tool
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node js/scripts/run-grammar-interchange-tools.mjs --out issue-195-artifacts/grammar-interchange-tools.lino

      - name: Upload the grammar conversion target-tool report
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-interchange-tools-${{ github.sha }}
          path: issue-195-artifacts/grammar-interchange-tools.lino
          retention-days: 7
          if-no-files-found: error

      - name: Install the pinned independent Lark grammar target tool
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir lark==1.3.1

      - name: Run grammar conversion cycles under the actual Lark target tool
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        run: node js/scripts/run-grammar-interchange-lark.mjs --out issue-195-artifacts/grammar-interchange-lark.lino

      - name: Upload the independent Lark conversion report
        if: ${{ !cancelled() && matrix.group == 'grammar' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-interchange-lark-${{ github.sha }}
          path: issue-195-artifacts/grammar-interchange-lark.lino
          retention-days: 7
          if-no-files-found: error

      - name: Check the foundation models are neutral data
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:foundations
        working-directory: js

      - name: Check issue 195 atomic requirement manifest
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:issue-195
        working-directory: js

      - name: Check issue 195 source register against the ledger
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:issue-195:sources
        working-directory: js

      - name: Compare the issue 195 source register with the live discussion (post-merge report)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.group == 'contracts' }}
        continue-on-error: true
        run: npm run check:issue-195:sources -- --online
        working-directory: js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the downstream consumer matrix against the ledger and the tests
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:downstream-consumers
        working-directory: js

      - name: Compare the pinned RML audit with the live pull request head (post-merge report)
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.group == 'contracts' }}
        continue-on-error: true
        run: node scripts/issue-195-rml-pr184.mjs --online
        working-directory: js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that every dependency, toolchain, action and image is inventoried at its current stable release or records why not
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:dependencies
        working-directory: js

      - name: Check readable English names against WordNet, the concept records and the source inventory
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:naming
        working-directory: js

      - name: Check associative data storage and necessary external JSON interfaces
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: node scripts/check-project-data-storage.mjs
        working-directory: js

      - name: Check that the documentation agrees with the requirement ledger
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:documentation
        working-directory: js

      - name: Check the shared self-translation cases
        if: ${{ !cancelled() && matrix.group == 'contracts' }}
        run: npm run check:self-translation
        working-directory: js

      - name: Setup Rust formatting for generated frontend rules
        if: ${{ !cancelled() && matrix.group == 'generated' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check the generated Rust frontend rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: npm run check:frontend-rules
        working-directory: js

      - name: Check the generated global concept rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-global-concept-rules.mjs --check

      - name: Check the generated discovery integration rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-discovered-concept-rules.mjs --check

      - name: Check shared discovered concept graph fixtures
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-discovered-concept-fixture.mjs --check

      - name: Check generated concept view admission rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-concept-view-rules.mjs --check

      - name: Check shared ontology and taxonomy view fixtures
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-concept-view-fixture.mjs --check

      - name: Check generated binary link network rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-link-network-binary-rules.mjs --check

      - name: Check shared binary link network fixtures
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-link-network-binary-fixtures.mjs --check

      - name: Check the generated Resource Description Framework rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-resource-description-rules.mjs --check

      - name: Check shared Resource Description Framework graph fixtures
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-resource-description-fixture.mjs --check

      - name: Check generated resource triple syntax character rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-resource-description-ntriples-characters.mjs --check

      - name: Check generated resource triple syntax token rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-resource-description-ntriples-rules.mjs --check

      - name: Check shared resource triple syntax fixtures
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-resource-description-ntriples-fixture.mjs --check

      - name: Check the generated grammar merge decisions against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-grammar-merge-decisions.mjs --check

      - name: Check the generated structural type rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-structured-type-rules.mjs --check

      - name: Check the generated primitive value rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-primitive-value-rules.mjs --check

      - name: Check the shared Rust array runtime artifacts
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-rust-array-runtime.mjs --check

      - name: Check the generated TypeScript erasure rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-typescript-erasure-rules.mjs --check

      - name: Check the generated typed program link rules against JavaScript
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        run: node js/scripts/generate-typed-program-link-rules.mjs --check

      - name: Check shared self translation representation artifacts
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        working-directory: js
        run: node scripts/generate-self-translation-representation.mjs --native --check

      - name: Check generated Rust cast syntax rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        working-directory: js
        run: node scripts/generate-rust-cast-syntax-rules.mjs --check

      - name: Check original link schema source closure
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        working-directory: js
        run: node ../experiments/original-link-complete-table-projection/generate-raw-schema-source-closure.mjs --check

      - name: Check generated original-link network projection rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        working-directory: js
        run: node scripts/generate-network-projection-rules.mjs --check

      - name: Check generated JavaScript array binding rules
        if: ${{ !cancelled() && matrix.group == 'generated' && matrix.generated_slice == 'second' }}
        working-directory: js
