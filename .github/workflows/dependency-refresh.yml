name: Dependency Refresh

# Dependency freshness is live registry state that changes outside any pull
# request, so no pull request check depends on it. This scheduled job on main
# updates the lockfiles within the declared ranges, refreshes the committed
# dependency audit from the registries and opens its own pull request, whose
# checks then compare offline against the refreshed audit.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Dependencies
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Only this job pushes the refresh branch and opens its pull request, and
    # refreshes queue instead of cancelling one another mid-push.
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: dependency-refresh-${{ github.repository }}-write
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Update the lockfiles within the declared ranges
        run: |
          (cd js && npm update --ignore-scripts)
          (cd rust && cargo update)

      - name: Refresh the dependency audit from the registries
        id: audit
        # Live registry state is a main-only report. Keep the actual failed
        # outcome and findings so they reach the repair PR and its strict checks.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: js
        run: |
          npm run dependencies:refresh 2>&1 | tee dependency-refresh.log

      - name: Retain the live dependency report
        if: ${{ !cancelled() && hashFiles('js/dependency-refresh.log') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            js/dependency-refresh.log
            parity/dependency-inventory.lino
            docs/dependency-audit.md
          if-no-files-found: error

      - name: Report the live audit outcome
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          printf 'Live dependency audit outcome: **%s**. See the retained report and refresh PR for repairs. Required PR dependency checks remain unchanged.\n' "$AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" != success ]; then
            echo '::warning::The live dependency audit reported failures. Its retained findings require repair; no PR or delivery gate is waived.'
          fi

      - name: Open or update the refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/dependency-refresh
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if git diff --quiet; then
            if [ "$AUDIT_OUTCOME" = success ]; then
              echo "dependencies and the audit are current"
            else
              echo "no tracked updates; live audit findings remain in the retained report"
            fi
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git commit --all --message "chore(deps): scheduled dependency refresh ($(date -u +%F))"
          git push --force origin "$BRANCH"
          body="$RUNNER_TEMP/dependency-refresh-pr.md"
          cat > "$body" <<EOF
          Lockfile updates within the declared ranges and the refreshed dependency audit in docs/dependency-audit.md.

          Live audit outcome: **$AUDIT_OUTCOME**. The retained dependency-refresh artifact contains the complete audit log. Any unresolved findings require repairs; compatibility reasons are not invented. Required offline PR checks and current-dependency delivery gates remain unchanged.
          EOF
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): scheduled dependency refresh" \
              --body-file "$body"
          else
            gh pr edit "$existing" --body-file "$body"
          fi

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown
