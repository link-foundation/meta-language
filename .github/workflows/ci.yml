name: CI

# The JavaScript workflow runs first; the Rust workflow runs only after every
# JavaScript job passes. When a JavaScript job fails, the Rust jobs show as
# skipped, not failed or missing. js.yml and rust.yml keep their release and
# dispatch triggers, so a release still runs them standalone.
on:
  push:
    branches:
      - main
    paths:
      - 'js/**'
      - 'rust/**'
      - 'parity/**'
      - 'docs/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.gitignore'
      - '.secretlintrc.json'
      - 'CONTRIBUTING.md'
      - 'experiments/**/Cargo.toml'
      - '**/lean-toolchain'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'js/**'
      - 'rust/**'
      - 'parity/**'
      - 'docs/**'
      - 'scripts/**'
      - '.githooks/**'
      - '.github/workflows/**'
      - '.pre-commit-config.yaml'
      - '.gitignore'
      - '.secretlintrc.json'
      - 'CONTRIBUTING.md'
      - 'experiments/**/Cargo.toml'
      - '**/lean-toolchain'

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run; push runs
# are grouped by their own run id, so a release on main is never cancelled.
# The called workflows use their own literal js- and rust- prefixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The Rust workflow used to run only for the paths below; a change outside
  # them (for example js/** alone) runs the JavaScript workflow and skips Rust.
  changes:
    name: Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether the Rust workflow is needed
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust_paths='^(rust/|parity/|docs/|scripts/|\.github/workflows/(ci|rust)\.yml$|\.secretlintrc\.json$)'
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            rust=true
          elif git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$rust_paths"; then
            rust=true
          else
            rust=false
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust workflow needed: $rust"

  js:
    name: JavaScript
    uses: ./.github/workflows/js.yml
    secrets: inherit
    # A called workflow gets at most the caller's permissions; publish asks for
    # id-token although it runs only on a release or a dispatch of js.yml.
    permissions:
      contents: read
      id-token: write

  rust:
    name: Rust
    needs: [changes, js]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust.yml
    secrets: inherit
    # The release and website jobs run on a push to main and ask for these.
    permissions:
      contents: write
      actions: write
      pull-requests: write
      pages: write
      id-token: write

  # The bulk grammar pipeline (I195-GRAMMAR-BULK-PIPELINE) imports, compiles,
  # parses and merges the tree-sitter and grammars-v4 grammars of every
  # catalog language with a grammar and publishes the matrix in the job
  # summary and as an artifact. A language that fails is a matrix row listing
  # its missing features, not a failed job; the job fails only when the
  # pipeline itself cannot run. It runs beside the JavaScript and Rust
  # workflows and holds neither back.
  grammar-bulk-pipeline:
    name: Bulk Grammar Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Fetch the pinned grammar crates
        run: cargo fetch --locked
        working-directory: rust

      - name: Run the bulk grammar pipeline
        run: node js/scripts/run-grammar-bulk-pipeline.mjs --out-dir grammar-bulk --jobs 4 --timeout 240

      - name: Publish the matrix in the job summary
        if: ${{ !cancelled() && hashFiles('grammar-bulk/grammar-bulk-matrix.md') != '' }}
        run: cat grammar-bulk/grammar-bulk-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the matrix
        if: ${{ !cancelled() && hashFiles('grammar-bulk/grammar-bulk-matrix.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-bulk-matrix
          path: grammar-bulk/

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown
