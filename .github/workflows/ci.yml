name: CI

# The JavaScript workflow runs first; the Rust workflow and the issue 195
# acceptance stages run only after every JavaScript job passes, and each Rust
# acceptance stage runs only after its JavaScript counterpart. When a
# JavaScript job fails, the jobs after it show as skipped, and the Full
# Requirements Aggregate reports one gate error naming the failed JavaScript
# jobs. js.yml and rust.yml keep their release and dispatch triggers, so a
# release runs them standalone; here a release runs only the acceptance
# release-delivery checkpoint. Every push and pull request runs, without path
# filters, because Full Requirements Aggregate is a required check.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  contents: read

# Pull request numbers keep cancellation queues stable after merge. Every other
# verification run and its jobs use their own run id; main runs cannot collide.
# The called workflows use their own literal js- and rust- prefixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # The Rust workflow used to run only for the paths below; a change outside
  # them (for example js/** alone) runs the JavaScript workflow and skips Rust.
  changes:
    name: Changed Paths
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      native_test_inputs_changed: ${{ steps.paths.outputs.native_test_inputs_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether the Rust workflow is needed
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust_paths='^(rust/|parity/|docs/|scripts/|experiments/rust-text-value-projection/|experiments/rust-raw-binding-identifiers/|experiments/rust-text-certificate/|experiments/rust-raw-binding-certificate-adapter/|experiments/rust-text-certificate-adapter/|experiments/rust-text-certificate-library/|experiments/original-link-identity/|experiments/original-link-role-projection/|experiments/fresh-number-array-collectors/|experiments/original-link-symbol-projection/|experiments/original-link-table-projection/|experiments/original-link-complete-table-projection/|experiments/grammar-outcome-network/native-transport/|experiments/binary-metadata-buffer/|js/scripts/generate-link-network-binary-rules\.mjs$|js/scripts/binary-metadata-candidate-styles\.mjs$|js/scripts/source-text-byte-library-style\.mjs$|js/scripts/product-rule-style-corrections\.mjs$|js/scripts/rust-library-packaging\.mjs$|experiments/source-native-observations\.mjs$|\.github/workflows/(ci|rust)\.yml$|\.secretlintrc\.json$)'
          native_test_inputs_changed=false
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            rust=true
            native_test_inputs_changed=true
          else
            changed_paths="$(git diff --name-only "$BASE_SHA" HEAD)"
            if printf '%s\n' "$changed_paths" | grep -E "$rust_paths" > /dev/null; then
              rust=true
            else
              rust=false
            fi
            if printf '%s\n' "$changed_paths" | grep -E "$rust_paths" | grep -Ev '\.md$' | grep -E '(^experiments/|\.lino$|^js/scripts/(generate-link-network-binary-rules|binary-metadata-candidate-styles|source-text-byte-library-style|product-rule-style-corrections)\.mjs$)' > /dev/null; then
              native_test_inputs_changed=true
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "native_test_inputs_changed=$native_test_inputs_changed" >> "$GITHUB_OUTPUT"
          echo "Rust workflow needed: $rust"

  js:
    name: JavaScript
    # js.yml has its own release trigger; calling it here too would publish twice.
    if: ${{ github.event_name != 'release' }}
    uses: ./.github/workflows/js.yml
    with:
      external_reports: true
    secrets: inherit
    # A called workflow gets at most the caller's permissions; publish asks for
    # id-token although it runs only on a release or a dispatch of js.yml.
    permissions:
      contents: read
      id-token: write

  rust:
    name: Rust
    needs: [changes, js, self-translation-report-validation]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust.yml
    with:
      native_test_inputs_changed: ${{ needs.changes.outputs.native_test_inputs_changed == 'true' }}
    secrets: inherit
    # The release and website jobs run on a push to main and ask for these.
    permissions:
      contents: write
      actions: write
      pull-requests: write
      pages: write
      id-token: write

  # Publishes, per module, how far the self-translation of each JavaScript
  # module is from its hand-written Rust. The whole of js/src takes over an
  # hour on one runner, so the modules are split into shards of about the same
  # size. It runs beside the JavaScript and Rust workflows; acceptance verifies
  # every published module before recording the reporting assertion.
  self-translation-report:
    name: Self-Translation Report (${{ matrix.shard }}/8, part ${{ matrix.part }}/2)
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        part: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Report self-translation against the hand-written Rust
        env:
          META_LANGUAGE_REPORT_PROGRESS: '1'
        run: |
          node scripts/generate-self-translation-report.mjs --shard ${{ matrix.shard }}/8 --physical-part ${{ matrix.part }}/2 --out-dir ../self-translation-report > /dev/null
          cat ../self-translation-report/self-translation-report.md >> "$GITHUB_STEP_SUMMARY"
        working-directory: js

      - name: Upload the self-translation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: self-translation-report-${{ github.sha }}-${{ matrix.shard }}-${{ matrix.part }}
          path: self-translation-report
          if-no-files-found: error

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  self-translation-report-validation:
    name: JavaScript / Self-Translation Report Assertions
    needs: self-translation-report
    if: ${{ !cancelled() && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Download the complete self-translation reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: self-translation-report-${{ github.sha }}-*
          path: issue-195-artifacts/self-translation-report

      - name: Run the report artifact test group
        if: ${{ !cancelled() }}
        env:
          ISSUE_195_SELF_TRANSLATION_REPORT_DIRECTORY: ${{ github.workspace }}/issue-195-artifacts/self-translation-report
        run: node ../scripts/with-cache-cleanup.mjs --event test -- node scripts/test-groups.mjs --run report-artifacts
        working-directory: js

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # The bulk grammar pipeline (I195-GRAMMAR-BULK-PIPELINE) imports, compiles,
  # parses and merges the tree-sitter and grammars-v4 grammars of every
  # catalog language with a grammar and publishes the matrix in the job
  # summary and as an artifact. A language that fails is a matrix row listing
  # its missing features, not a failed job; the job fails only when the
  # pipeline itself cannot run. It runs beside the JavaScript and Rust
  # workflows and holds neither back.
  grammar-bulk-pipeline:
    name: Bulk Grammar Pipeline
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Fetch the pinned grammar crates
        run: cargo fetch --locked
        working-directory: rust

      - name: Provision the pinned external grammar inputs
        run: node js/scripts/external-grammar-cache.mjs --all --materialize

      # Source provenance only: reuse the immutable .crate Cargo already fetched.
      # The receipt does not establish native Markdown scanner or CST support.
      - name: Capture the pinned Markdown block and inline source closure
        if: ${{ !cancelled() }}
        run: >-
          node js/scripts/capture-markdown-native-sources.mjs
          --cargo-cache --out grammar-bulk/markdown-native-source-capture.lino

      - name: Upload the authenticated Markdown source receipt
        if: ${{ !cancelled() && hashFiles('grammar-bulk/markdown-native-source-capture.lino') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: markdown-native-source-capture-${{ github.sha }}
          path: grammar-bulk/markdown-native-source-capture.lino
          if-no-files-found: error

      - name: Compare the pinned inline scanner source with shared Links operations
        if: ${{ !cancelled() }}
        run: >-
          node experiments/markdown-inline-source-oracle/check.mjs
          --cargo-cache --out grammar-bulk/markdown-inline-source-oracle.lino

      - name: Lower the original Markdown fence source into inspectable C data
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: >-
          node experiments/restricted-c-source-lowering/capture-markdown.mjs
          --cargo-cache --receipt grammar-bulk/markdown-native-source-capture.lino
          --out grammar-bulk/markdown-fence-source-lowering.lino

      - name: Upload the source-only C lowering and explicit obligations
        if: ${{ !cancelled() && hashFiles('grammar-bulk/markdown-fence-source-lowering*.lino') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: markdown-fence-source-lowering-${{ github.sha }}
          path: grammar-bulk/markdown-fence-source-lowering*.lino
          if-no-files-found: error

      - name: Upload the independent inline scanner comparisons
        if: ${{ !cancelled() && hashFiles('grammar-bulk/markdown-inline-source-oracle.lino') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: markdown-inline-source-oracle-${{ github.sha }}
          path: grammar-bulk/markdown-inline-source-oracle.lino
          if-no-files-found: error

      - name: Run the bulk grammar pipeline
        if: ${{ !cancelled() }}
        run: node js/scripts/run-grammar-bulk-pipeline.mjs --out-dir grammar-bulk --jobs 4 --timeout 240

      - name: Publish the matrix in the job summary
        if: ${{ !cancelled() && hashFiles('grammar-bulk/grammar-bulk-matrix.md') != '' }}
        run: cat grammar-bulk/grammar-bulk-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the matrix
        if: ${{ !cancelled() && hashFiles('grammar-bulk/grammar-bulk-matrix.lino') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-bulk-matrix
          path: grammar-bulk/

      - name: Upload the compact grammar summary
        if: ${{ !cancelled() && hashFiles('grammar-bulk/grammar-bulk-matrix.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: grammar-bulk-summary
          path: grammar-bulk/grammar-bulk-matrix.md

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # The issue 195 acceptance stages (I195-CI-ACCEPTANCE-AFTER-JAVASCRIPT).
  candidates:
    name: Delivery Candidates
    # The acceptance stages start only after every JavaScript job passed. On a
    # release, js.yml runs by its own trigger and the js job here is skipped.
    needs: [js, self-translation-report-validation]
    if: ${{ !cancelled() && (needs.js.result == 'success' || (github.event_name == 'release' && needs.js.result == 'skipped')) && (needs.self-translation-report-validation.result == 'success' || (github.event_name == 'release' && needs.self-translation-report-validation.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-candidates-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      # The evidence runner reads the language catalog, whose native grammar
      # source names are parsed with links-notation.
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      # The package remains install-script-free and parses offline. Its current
      # compiled fallback grammars are staged from authenticated temporary
      # inputs; upstream sources and independent oracles are never published.
      - name: Provision the pinned package grammar binaries
        if: ${{ github.event_name != 'release' }}
        run: node js/scripts/external-grammar-cache.mjs --group wasm --materialize

      - name: Pack candidates or download the published release
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --prepare-candidates .issue-195-work/candidates

      - name: Retain delivery candidate execution logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-candidate-feedback-${{ github.sha }}
          path: issue-195-results/logs/*.log
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  consumers:
    name: Clean Consumer (${{ matrix.os }})
    needs: candidates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: issue-195-consumer-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      # Only the repository reporting tools use these dependencies. Installed
      # consumers still resolve and execute their exact candidate artifacts.
      - name: Install the linked report reader dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio with C++ tools not found"
          }
          $vcvars = Join-Path $installationPath "VC\Auxiliary\Build\vcvars64.bat"
          $vcvarsEnvironment = @{}
          $existingPath = $env:Path -split ";" | Where-Object { $_ }
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              $vcvarsEnvironment[$name] = $value
              if ($name -eq "Path") {
                # GITHUB_PATH prepends to the existing PATH; a Path entry in GITHUB_ENV would add a
                # second, differently cased variable that child processes may resolve instead.
                # Only the directories vcvars added are prepended: re-prepending the runner's own
                # entries would put WindowsApps (whose bash.exe is the WSL launcher) ahead of Git Bash.
                $value -split ";" | Where-Object { $_ -and ($existingPath -notcontains $_) } | ForEach-Object {
                  $_ | Out-File -FilePath $env:GITHUB_PATH -Append
                }
              } elseif ($name -match "^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)$") {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append
              }
            }
          }
          $msvcLinker = Join-Path $vcvarsEnvironment["VCToolsInstallDir"] "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $msvcLinker)) {
            throw "MSVC link.exe not found at $msvcLinker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Git's bin/bash.exe launcher prepends its own Unix tools, including link.exe.
          # Restore only the validated MSVC directory after that launcher has run.
          Split-Path -Parent $msvcLinker | Out-File -FilePath $env:GITHUB_PATH -Append
          $bashEnvironment = Join-Path $env:RUNNER_TEMP "meta-language-msvc-bash-env.sh"
          'export PATH="$(dirname "$(cygpath -u "$CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER")"):$PATH"' + "`n" |
            Set-Content -LiteralPath $bashEnvironment -Encoding utf8 -NoNewline
          "BASH_ENV=$($bashEnvironment.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Verify Windows native linker resolution
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const path = require('node:path');
          const {spawnSync} = require('node:child_process');
          const expected = process.env.CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER;
          if (!expected || !path.win32.isAbsolute(expected)) throw new Error('A validated absolute MSVC linker path is required');
          let resolved;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            resolved = spawnSync('where.exe', ['link.exe'], {encoding: 'utf8', timeout: 10000, maxBuffer: 65536, windowsHide: true});
            if (resolved.error?.code !== 'ETIMEDOUT' || resolved.signal !== 'SIGTERM' || resolved.status !== null) break;
            if (attempt < 3) console.error(`Retrying timed-out Windows linker lookup (${attempt}/3): ${resolved.error.message}`);
          }
          if (resolved.error || resolved.status !== 0 || resolved.signal !== null || typeof resolved.stdout !== 'string') {
            throw new Error(`Windows linker lookup failed: status=${resolved.status}, signal=${resolved.signal}, ${resolved.error?.message ?? resolved.stderr}`, {cause: resolved.error});
          }
          const actual = resolved.stdout.split(/\r?\n/u)[0].trim();
          if (!path.win32.isAbsolute(actual) || path.win32.normalize(actual).toLowerCase() !== path.win32.normalize(expected).toLowerCase()) {
            throw new Error(`Windows native child resolves ${actual || '<no linker>'}; expected ${expected}`);
          }
          console.log(`Validated Windows native child linker: ${actual}`);
          NODE

      - name: Install and parse the exact artifacts in clean consumers
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          node js/scripts/run-issue-195-consumer.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-consumer"
          --out issue-195-artifacts/platform/report.lino

      # The delivery gate: every retained item is current or at its verified
      # newest compatible release, and the clean consumer resolves the audited
      # npm releases. A pull request compares offline against the committed
      # audit; the live registries change outside the pull request.
      - name: Check delivered dependencies against the committed audit
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        shell: bash
        run: >-
          node js/scripts/check-dependencies.mjs --delivery --offline
          --consumer-lock "$RUNNER_TEMP/issue-195-consumer/npm-consumer/package-lock.json"

      # Post-merge report: a release published after the audit date is moved to
      # by the scheduled dependency refresh, never by failing a check.
      - name: Compare the delivered dependencies with the live registries
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node js/scripts/check-dependencies.mjs --delivery --live
          --consumer-lock "$RUNNER_TEMP/issue-195-consumer/npm-consumer/package-lock.json"

      - uses: actions/upload-artifact@v7
        with:
          name: issue-195-platform-${{ matrix.os }}-${{ github.sha }}
          path: issue-195-artifacts/platform/report.lino
          if-no-files-found: error
          retention-days: 30

      - name: Upload consumer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-consumer-logs-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/issue-195-consumer/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-consumer/crate-target"

  rml-workloads:
    name: Relative Meta Logic Workloads
    needs: candidates
    runs-on: ubuntu-latest
    # theory-network.test.mjs alone takes minutes, and the Rust workloads build RML from scratch.
    timeout-minutes: 90
    concurrency:
      group: issue-195-rml-workloads-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      # Only the repository reporting tools use these dependencies. Installed
      # consumers still resolve and execute their exact candidate artifacts.
      - name: Install the linked report reader dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Run the relative-meta-logic pull request 184 workloads on the exact artifacts
        shell: bash
        run: >-
          node js/scripts/run-rml-pr184-workloads.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-rml-workloads"
          --out issue-195-artifacts/rml-workloads/report.lino

      # The report is uploaded even when a workload fails: the aggregate validates it and
      # records nothing for the assertions it does not support.
      - name: Upload the workload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-rml-workloads-${{ github.sha }}
          path: issue-195-artifacts/rml-workloads/report.lino
          if-no-files-found: error
          retention-days: 30

      - name: Upload workload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-rml-workload-logs-${{ github.sha }}
          path: ${{ runner.temp }}/issue-195-rml-workloads/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-rml-workloads/rml-target"

  formal-ai-workload-parts:
    name: Formal AI Workloads (${{ matrix.partition }})
    needs: candidates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [corpus-ratchet, remaining]
    # Every candidate runs fresh consumers; the optional target cache reuses build outputs only.
    timeout-minutes: 120
    concurrency:
      group: issue-195-formal-ai-workloads-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-${{ matrix.partition }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      # Only the repository reporting tools use these dependencies. Installed
      # consumers still resolve and execute their exact candidate artifacts.
      - name: Install the linked report reader dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      # The runner was shut down (signal 15, status 143) without output while cargo built
      # formal-ai's test targets from scratch. The workload runner bounds the
      # build (two jobs, no debuginfo; see js/scripts/run-formal-ai-workloads.mjs);
      # this frees the disk the preinstalled SDKs the job never uses take, and
      # the registry cache spares the dependency downloads.
      - name: Free runner disk space
        shell: bash
        run: |
          df -h / "$RUNNER_TEMP"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / "$RUNNER_TEMP"
          free -h

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-formal-ai-${{ hashFiles('parity/fixtures/formal-ai-workloads.lino', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-formal-ai-

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      # Candidate identity is independently checked before selecting a build
      # cache. The runner repeats checksum and installed-path validation.
      - name: Identify the exact Formal AI build cache
        id: formal-ai-cache-key
        shell: bash
        env:
          CACHE_CONTEXT: formal-ai-target-v1-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-opt3-debug0-incremental0-${{ hashFiles('parity/fixtures/formal-ai-workloads.lino', 'js/scripts/run-formal-ai-workloads.mjs', 'js/scripts/issue-195-formal-ai-rust-probe.mjs', 'js/scripts/formal-ai-workload-partitions.mjs', 'js/scripts/formal-ai-partition-bundles.mjs') }}
        run: |
          set -euo pipefail
          candidate_crates=(.issue-195-work/candidates/*.crate)
          [ "${#candidate_crates[@]}" -eq 1 ]
          candidate_crate="${candidate_crates[0]}"
          (cd "$(dirname "$candidate_crate")" && sha256sum --check "$(basename "$candidate_crate").sha256")
          candidate_digest="$(sha256sum "$candidate_crate" | cut -d ' ' -f 1)"
          compiler_identity="$(rustc -vV)"
          printf '%s\n' "$compiler_identity" | grep -Fx 'release: 1.99.0'
          compiler_digest="$(printf '%s\n' "$compiler_identity" | sha256sum | cut -d ' ' -f 1)"
          dependency_key="$CACHE_CONTEXT-$compiler_digest"
          printf 'dependency_key=%s\nkey=%s\n' "$dependency_key" "$dependency_key-$candidate_digest" >> "$GITHUB_OUTPUT"

      - name: Restore Formal AI build outputs
        id: formal-ai-target-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/issue-195-formal-ai-build/target/debug
            ${{ runner.temp }}/issue-195-formal-ai-build/target/.rustc_info.json
            ${{ runner.temp }}/issue-195-formal-ai-build/target/CACHEDIR.TAG
          key: ${{ steps.formal-ai-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.formal-ai-cache-key.outputs.dependency_key }}-

      - name: Run the link-assistant/formal-ai workloads on the exact artifacts
        shell: bash
        run: >-
          node js/scripts/run-formal-ai-workloads.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads"
          --cargo-target-dir "$RUNNER_TEMP/issue-195-formal-ai-build/target"
          --partition "${{ matrix.partition }}"
          --out ".issue-195-work/formal-ai-partitions/${{ matrix.partition }}/partition.lino"

      # The report is uploaded even when a workload fails: the aggregate validates it and
      # records nothing for the assertions it does not support.
      - name: Upload the workload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-partition-${{ matrix.partition }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .issue-195-work/formal-ai-partitions/${{ matrix.partition }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload workload logs and runtime outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-workload-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/issue-195-formal-ai-workloads/*.log
            ${{ runner.temp }}/issue-195-formal-ai-workloads/*-outputs.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/formal-ai-inputs.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/rust-probe/*.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/self-ast-*.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/post-update-Cargo.lock
          if-no-files-found: ignore
          retention-days: 30

      # Save before teardown can prune build products. Every workload above
      # still executes on a hit; neither consumers nor results enter this cache.
      - name: Save Formal AI build outputs
        if: ${{ !cancelled() && matrix.partition == 'remaining' && steps.formal-ai-cache-key.outcome == 'success' && steps.formal-ai-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/issue-195-formal-ai-build/target/debug
            ${{ runner.temp }}/issue-195-formal-ai-build/target/.rustc_info.json
            ${{ runner.temp }}/issue-195-formal-ai-build/target/CACHEDIR.TAG
          key: ${{ steps.formal-ai-cache-key.outputs.key }}

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads/formal-ai-target" --target-dir "$RUNNER_TEMP/issue-195-formal-ai-build/target"

  # Preserve the canonical full-report producer identity. Only independently
  # verified partials enter its unchanged complete report/acceptance contract.
  formal-ai-workloads:
    name: Formal AI Workloads
    needs: [candidates, formal-ai-workload-parts]
    if: ${{ !cancelled() && needs.candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: issue-195-formal-ai-workloads-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install the linked report reader dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Download the exact corpus-ratchet partial
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: issue-195-formal-ai-partition-corpus-ratchet-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .issue-195-work/formal-ai-partitions/corpus-ratchet

      - name: Download the exact remaining partial
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          name: issue-195-formal-ai-partition-remaining-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .issue-195-work/formal-ai-partitions/remaining

      - name: Download both complete producer diagnostics
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: issue-195-formal-ai-workload-logs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .issue-195-work/formal-ai-partition-logs

      - name: Merge the independently validated Formal AI workloads
        if: ${{ !cancelled() }}
        shell: bash
        run: >-
          node js/scripts/run-formal-ai-workloads.mjs
          --merge-partitions .issue-195-work/formal-ai-partitions/corpus-ratchet,.issue-195-work/formal-ai-partitions/remaining
          --producer-result "${{ needs.formal-ai-workload-parts.result }}"
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads"
          --out issue-195-artifacts/formal-ai-workloads/report.lino

      - name: Upload the workload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-workloads-${{ github.sha }}
          path: issue-195-artifacts/formal-ai-workloads/report.lino
          if-no-files-found: error
          retention-days: 30

      - name: Upload workload logs and runtime outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-workload-logs-${{ github.sha }}
          path: |
            .issue-195-work/formal-ai-partitions/
            .issue-195-work/formal-ai-partition-logs/
            ${{ runner.temp }}/issue-195-formal-ai-workloads/*-outputs.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/formal-ai-inputs.lino
            ${{ runner.temp }}/issue-195-formal-ai-workloads/partition-provenance.lino
          if-no-files-found: warn
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: env -u CARGO_TARGET_DIR -u CARGO_BUILD_TARGET_DIR node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads"

  # The checkpoint evidence runs as separate stage jobs (js/scripts/issue-195-evidence-stages.mjs),
  # each on its own runner with only the toolchains it uses, and each uploading
  # its record. The Full Requirements Aggregate only merges and evaluates them.
  runtime-parity:
    name: Evidence Stage (runtime-parity)
    needs: [js, self-translation-report-validation]
    if: ${{ github.event_name != 'release' && needs.js.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-runtime-parity-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Provision the pinned runtime comparison grammars
        run: node js/scripts/external-grammar-cache.mjs --group wasm --group native-oracles --materialize

      - name: Compare the JavaScript and Rust runtimes
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage runtime-parity

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # The JavaScript stages run before the Rust stages: native-rust needs
  # native-javascript and rust-suite needs javascript-suite, so a failed
  # JavaScript stage shows its Rust stage as skipped. The aggregate reports a
  # skipped stage's missing record as one gate error.
  native-javascript:
    name: Evidence Stage (native-javascript)
    needs: [js, runtime-parity]
    # A failed runtime-parity stage still uploads its record; this stage then
    # records why it has no translations to validate.
    if: ${{ !cancelled() && github.event_name != 'release' && needs.js.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-native-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-javascript
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download the runtime-parity stage outputs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: issue-195-results

      - name: Validate the emitted translations with the native toolchain
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          TARGET: native-javascript
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$TARGET"

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-native-javascript-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  native-rust:
    name: Evidence Stage (native-rust)
    needs: [runtime-parity, native-javascript]
    if: ${{ !cancelled() && github.event_name != 'release' && needs.native-javascript.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-native-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-rust
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download the runtime-parity stage outputs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: issue-195-results

      - name: Validate the emitted translations with the native toolchain
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          TARGET: native-rust
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$TARGET"

      - name: Validate TypeScript graph Rust execution
        if: ${{ !cancelled() }}
        run: node experiments/typescript-typed-graph/run-native.mjs --results-dir issue-195-results

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-native-rust-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  native-translations:
    name: Evidence Stage (native-${{ matrix.target }})
    needs: [js, runtime-parity]
    # A failed runtime-parity stage still uploads its record; this stage then
    # records why it has no translations to validate.
    if: ${{ !cancelled() && github.event_name != 'release' && needs.js.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-native-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [lean, rocq]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup Lean
        if: ${{ matrix.target == 'lean' }}
        env:
          ELAN_HOME: ${{ runner.temp }}/elan-home
          ELAN_VERSION: v4.2.4
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          archive="${RUNNER_TEMP}/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          echo "${ELAN_HOME}/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=${ELAN_HOME}" >> "$GITHUB_ENV"
          if ! "${ELAN_HOME}/bin/lean" --version; then
            node scripts/install-ci-lean.mjs
          fi
          "${ELAN_HOME}/bin/lean" --version

      - name: Setup OCaml
        if: ${{ matrix.target == 'rocq' }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          opam-pin: false

      - name: Identify the installed Rocq compiler cache
        if: ${{ matrix.target == 'rocq' }}
        id: rocq-toolchain-cache
        run: node scripts/ci-rocq-toolchain-cache.mjs --key

      - name: Restore the installed Rocq compiler cache
        if: ${{ matrix.target == 'rocq' && steps.rocq-toolchain-cache.outputs.enabled == 'true' }}
        id: rocq-toolchain-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.rocq-toolchain-cache.outputs.path }}
          key: ${{ steps.rocq-toolchain-cache.outputs.key }}

      - name: Install Rocq 9.3
        id: rocq-toolchain-install
        if: ${{ matrix.target == 'rocq' }}
        env:
          ROCQ_TOOLCHAIN_CACHE_KEY: ${{ steps.rocq-toolchain-cache.outputs.key }}
          ROCQ_TOOLCHAIN_CACHE_ENABLED: ${{ steps.rocq-toolchain-cache.outputs.enabled }}
          ROCQ_TOOLCHAIN_CACHE_HIT: ${{ steps.rocq-toolchain-restore.outputs.cache-hit }}
        run: |
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam install --yes 'rocq-core=9.3.0' 'rocq-stdlib=9.2.0' 'rocq-prover=meta.1'
          opam var bin >> "$GITHUB_PATH"
          opam exec -- rocq --version
          node scripts/ci-rocq-toolchain-cache.mjs --verify

      - name: Save the verified Rocq compiler cache
        if: ${{ matrix.target == 'rocq' && steps.rocq-toolchain-cache.outputs.enabled == 'true' && steps.rocq-toolchain-install.outputs.enabled == 'true' && steps.rocq-toolchain-install.outcome == 'success' && steps.rocq-toolchain-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rocq-toolchain-cache.outputs.path }}
          key: ${{ steps.rocq-toolchain-cache.outputs.key }}

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download the runtime-parity stage outputs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: issue-195-results

      - name: Validate the emitted translations with the native toolchain
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          TARGET: native-${{ matrix.target }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$TARGET"

      - name: Verify Unicode string length execution
        run: >-
          node js/scripts/check-translation-corpus-native.mjs
          --target "${{ matrix.target }}" --fixture string-length

      - name: Verify exact BigInt bitwise execution
        if: ${{ !cancelled() }}
        run: >-
