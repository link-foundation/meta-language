          ISSUE_195_RML_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/rml-workloads/report.lino
          ISSUE_195_FORMAL_AI_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/formal-ai-workloads/report.lino
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          STAGE: rust-suite
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$STAGE"
          --rust-shard "${{ matrix.physical_shard }}/8"
          --candidates .issue-195-work/candidates
          --platform-reports issue-195-artifacts/platform-reports

      - name: Seal the native evidence inventory and outcomes
        if: ${{ !cancelled() }}
        env:
          META_LANGUAGE_SHARD_RESULT: ${{ steps.rust-suite-evidence.outcome }}
        run: node js/scripts/rust-test-shards.mjs --finish

      - name: Upload the authenticated native evidence partition
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rust-physical-evidence-ubuntu-latest-all-${{ matrix.physical_shard }}-${{ github.sha }}
          path: issue-195-artifacts/rust-physical-shards/
          if-no-files-found: error
          retention-days: 30

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-rust-suite-${{ matrix.physical_shard }}-of-8-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  delivery:
    name: Evidence Stage (delivery)
    needs: [candidates, consumers, rml-workloads, formal-ai-workloads]
    if: ${{ !cancelled() && needs.candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-delivery
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Provision the pinned external grammar package binaries
        run: node js/scripts/external-grammar-cache.mjs --group wasm --materialize

      - name: Download delivery candidates
        uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Download platform consumer reports
        uses: actions/download-artifact@v8
        with:
          pattern: issue-195-platform-*-${{ github.sha }}
          path: issue-195-artifacts/platform-reports

      - name: Produce the stage evidence
        env:
          ISSUE_195_RML_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/rml-workloads/report.lino
          ISSUE_195_FORMAL_AI_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/formal-ai-workloads/report.lino
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          STAGE: delivery
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$STAGE"
          --candidates .issue-195-work/candidates
          --platform-reports issue-195-artifacts/platform-reports

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-delivery-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # Post-merge checks run on main only, as a non-blocking report: the live
  # default-branch rules exist outside any pull request, so no pull request
  # check depends on them, and a failure here is fixed in a follow-up commit.
  post-merge:
    name: Post-merge Report
    needs: [js, self-translation-report-validation]
    if: ${{ github.event_name == 'push' && needs.js.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-post-merge-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Inspect the default-branch rules with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint post-merge
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results

      - name: Evaluate the post-merge cells
        if: ${{ !cancelled() }}
        run: >-
          node js/scripts/check-issue-195-acceptance.mjs
          --evaluate
          --checkpoint post-merge
          --results-dir issue-195-results
          --json-report issue-195-artifacts/post-merge-report.lino
          --markdown-report issue-195-artifacts/post-merge-report.md

      - name: Publish the post-merge report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-post-merge-report-${{ github.sha }}
          path: |
            issue-195-artifacts/
            issue-195-results/logs/
            issue-195-results/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  acceptance:
    name: Full Requirements Aggregate
    needs: [js, rust, self-translation-report-validation, candidates, consumers, rml-workloads, formal-ai-workloads, javascript-suite-independent, runtime-parity, native-javascript, native-rust, native-translations, javascript-suite, rust-suite, delivery]
    # GitHub reports a skipped job as a successful required check. This job
    # always runs and fails itself when there are no candidates to evaluate.
    if: ${{ always() }}
    # actions: read lists the failed JavaScript jobs for the gate error.
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-acceptance-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}
      cancel-in-progress: true
    # When a JavaScript job failed, no acceptance stage ran: the first step
    # reports that as one gate error naming the failed JavaScript jobs, not one
    # per stage or requirement.
    steps:
      - name: Require delivery candidates
        if: ${{ needs.candidates.result != 'success' }}
        env:
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
          JAVASCRIPT_RESULT: ${{ needs.js.result }}
          REPORTS_RESULT: ${{ needs.self-translation-report-validation.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$JAVASCRIPT_RESULT" = failure ] || [ "$JAVASCRIPT_RESULT" = cancelled ] || [ "$REPORTS_RESULT" = failure ] || [ "$REPORTS_RESULT" = cancelled ]; then
            if failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.name | startswith("JavaScript / ")) | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .name'); then
              failed=$(printf '%s\n' "$failed" | paste -sd ',' - | sed 's/,/, /g')
            else
              printf '%s\n' 'GitHub failed-job metadata is unavailable; raw response follows:' "$failed" >&2
              failed=''
            fi
            echo "::error::${failed:-The JavaScript workflow and report assertions} finished as '${JAVASCRIPT_RESULT}/${REPORTS_RESULT}'; the acceptance stages run only after every JavaScript job passes, so none of them ran"
          else
            echo "::error::Delivery Candidates finished as '${CANDIDATES_RESULT}'; the Full Requirements Aggregate cannot pass without them"
          fi
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Provision the authenticated grammar input for manifest validation
        run: node js/scripts/external-grammar-cache.mjs --asset parity/grammars/links-notation-0.22.0.pegjs --materialize

      - name: Identify admitted Rust physical profiles
        id: rust-physical-admission
        if: ${{ !cancelled() && (needs.rust.result != 'skipped' || needs.rust-suite.result != 'skipped') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --paginate --slurp > "$RUNNER_TEMP/rust-physical-jobs.json"
          node js/scripts/rust-test-shards.mjs --admission "$RUNNER_TEMP/rust-physical-jobs.json"

      - name: Download complete Rust physical partitions
        if: ${{ !cancelled() && steps.rust-physical-admission.outputs.enabled == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: rust-physical-*-${{ github.sha }}
          path: issue-195-artifacts/rust-physical-partitions

      - name: Require the complete authenticated Rust test union
        if: ${{ !cancelled() && (needs.rust.result != 'skipped' || needs.rust-suite.result != 'skipped') }}
        env:
          RUST_WORKFLOW_RESULT: ${{ needs.rust.result }}
          RUST_EVIDENCE_RESULT: ${{ needs.rust-suite.result }}
          META_LANGUAGE_SHARD_EXPECTED_PROFILES: ${{ steps.rust-physical-admission.outputs.profiles }}
        run: |
          if [ -n "$META_LANGUAGE_SHARD_EXPECTED_PROFILES" ]; then
            node js/scripts/rust-test-shards.mjs --verify issue-195-artifacts/rust-physical-partitions
          fi
          if [ "$RUST_WORKFLOW_RESULT" != skipped ]; then test "$RUST_WORKFLOW_RESULT" = success; fi
          if [ "$RUST_EVIDENCE_RESULT" != skipped ]; then test "$RUST_EVIDENCE_RESULT" = success; fi

      - name: Validate atomic manifest and protected scope baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.release.target_commitish }}
          ISSUE_195_SCOPE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'issue-195-scope-change-approved') }}
        run: node js/scripts/check-issue-195-acceptance.mjs --scope-baseline "$BASELINE_SHA"

      # A stage whose job failed before uploading has no record here; the
      # aggregate reports it as one gate error naming the stage.
      - name: Download the evidence stage outputs
        if: ${{ !cancelled() && needs.candidates.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          # Every matrix partition carries distinct stage/observation identities;
          # merge retains all of them for the complete logical-suite validator.
          pattern: issue-195-stage-*-${{ github.sha }}
          path: issue-195-results
          merge-multiple: true

      - name: Merge the evidence stages
        if: ${{ !cancelled() && needs.candidates.result == 'success' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --aggregate

      - name: Evaluate every required verification cell
        if: ${{ always() && needs.candidates.result == 'success' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/check-issue-195-acceptance.mjs
          --produce-gate-results issue-195-results/gate-faults.lino
          --evaluate
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --results-dir issue-195-results
          --json-report issue-195-artifacts/report.lino
          --markdown-report issue-195-artifacts/report.md

      - name: Publish per-requirement evidence report
        if: ${{ always() && needs.candidates.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-requirement-report-${{ github.sha }}
          path: |
            issue-195-artifacts/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
            issue-195-results/work/native/
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary manifest grammar input
        if: ${{ !cancelled() && hashFiles('js/scripts/external-grammar-cache.mjs') != '' }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown
