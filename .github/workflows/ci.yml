  javascript-suite-independent:
    # Only the downstream partition reads the workload reports. Other partitions
    # retain their exact scopes and artifacts while those producers run.
    name: Evidence Stage (javascript-suite - ${{ matrix.group }} ${{ matrix.shard }})
    needs: [candidates, self-translation-report]
    if: ${{ !cancelled() && github.event_name != 'release' && needs.candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The evidence groups keep the same files and acceptance cells. Separate
    # runners prevent the serial sum from exceeding the existing deadline.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: grammar
            shard: 1/1
            partition: 1-of-1
          - group: grammar-native
            shard: 1/3
            partition: 1-of-3
          - group: grammar-native
            shard: 2/3
            partition: 2-of-3
          - group: grammar-native
            shard: 3/3
            partition: 3-of-3
          - group: grammar-recovery
            shard: 1/1
            partition: 1-of-1
          - group: grammar-scaling
            shard: 1/1
            partition: 1-of-1
          - group: grammar-csharp
            shard: 1/1
            partition: 1-of-1
          - group: grammar-elixir
            shard: 1/1
            partition: 1-of-1
          - group: grammar-ruby
            shard: 1/1
            partition: 1-of-1
          - group: translation
            shard: 1/6
            partition: 1-of-6
          - group: translation
            shard: 2/6
            partition: 2-of-6
          - group: translation
            shard: 3/6
            partition: 3-of-6
          - group: translation
            shard: 4/6
            partition: 4-of-6
          - group: translation
            shard: 5/6
            partition: 5-of-6
          - group: translation
            shard: 6/6
            partition: 6-of-6
          - group: report-artifacts
            shard: 1/1
            partition: 1-of-1
          - group: conformance
            shard: 1/2
            partition: 1-of-2
          - group: conformance
            shard: 2/2
            partition: 2-of-2
          - group: tooling
            shard: 1/1
            partition: 1-of-1
    concurrency:
      group: issue-195-stage-${{ github.event_name == 'pull_request' && format('pull-{0}', github.event.pull_request.number) || github.run_id }}-javascript-suite-${{ matrix.group }}-${{ matrix.partition }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          # JavaScript self-translation acceptance checks the emitted Rust.
          components: rustfmt, clippy

      - name: Setup Lean
        env:
          ELAN_HOME: ${{ runner.temp }}/elan-home
          ELAN_VERSION: v4.2.4
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          archive="${RUNNER_TEMP}/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          echo "${ELAN_HOME}/bin" >> "$GITHUB_PATH"
          echo "ELAN_HOME=${ELAN_HOME}" >> "$GITHUB_ENV"
          if ! "${ELAN_HOME}/bin/lean" --version; then
            node scripts/install-ci-lean.mjs
          fi
          "${ELAN_HOME}/bin/lean" --version

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          opam-pin: false

      - name: Identify the installed Rocq compiler cache
        id: rocq-toolchain-cache
        run: node scripts/ci-rocq-toolchain-cache.mjs --key

      - name: Restore the installed Rocq compiler cache
        if: ${{ steps.rocq-toolchain-cache.outputs.enabled == 'true' }}
        id: rocq-toolchain-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.rocq-toolchain-cache.outputs.path }}
          key: ${{ steps.rocq-toolchain-cache.outputs.key }}

      - name: Install Rocq 9.3
        id: rocq-toolchain-install
        env:
          ROCQ_TOOLCHAIN_CACHE_KEY: ${{ steps.rocq-toolchain-cache.outputs.key }}
          ROCQ_TOOLCHAIN_CACHE_ENABLED: ${{ steps.rocq-toolchain-cache.outputs.enabled }}
          ROCQ_TOOLCHAIN_CACHE_HIT: ${{ steps.rocq-toolchain-restore.outputs.cache-hit }}
        run: |
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam install --yes 'rocq-core=9.3.0' 'rocq-stdlib=9.2.0' 'rocq-prover=meta.1'
          opam var bin >> "$GITHUB_PATH"
          opam exec -- rocq --version
          node scripts/ci-rocq-toolchain-cache.mjs --verify

      - name: Save the verified Rocq compiler cache
        if: ${{ steps.rocq-toolchain-cache.outputs.enabled == 'true' && steps.rocq-toolchain-install.outputs.enabled == 'true' && steps.rocq-toolchain-install.outcome == 'success' && steps.rocq-toolchain-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.rocq-toolchain-cache.outputs.path }}
          key: ${{ steps.rocq-toolchain-cache.outputs.key }}

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Provision the pinned external grammar test inputs
        run: node js/scripts/external-grammar-cache.mjs --all --materialize

      - name: Download the complete self-translation reports
        # Missing reports fail their assertion while the other suite tests still run.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: self-translation-report-${{ github.sha }}-*
          path: issue-195-artifacts/self-translation-report

      - name: Build the independently corrected Agda layout oracle
        if: ${{ !cancelled() }}
        run: node js/scripts/build-agda-layout-oracle.mjs

      - name: Produce the stage evidence
        if: ${{ !cancelled() }}
        env:
          ISSUE_195_SELF_TRANSLATION_REPORT_DIRECTORY: ${{ github.workspace }}/issue-195-artifacts/self-translation-report
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          STAGE: javascript-suite
          JAVASCRIPT_GROUP: ${{ matrix.group }}
          JAVASCRIPT_SHARD: ${{ matrix.shard }}
          META_LANGUAGE_TOOLING_FULL_SCOPE: '1'
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$STAGE"
          --javascript-group "$JAVASCRIPT_GROUP"
          --javascript-shard "$JAVASCRIPT_SHARD"
          --candidates .issue-195-work/candidates
          --platform-reports issue-195-artifacts/platform-reports

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-javascript-suite-${{ matrix.group }}-${{ matrix.partition }}-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary external grammar inputs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: node js/scripts/external-grammar-cache.mjs --clean-materialized

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

