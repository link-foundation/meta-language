name: Issue 195 Full Acceptance

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  candidates:
    name: Delivery Candidates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-candidates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Pack candidates or download the published release
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --prepare-candidates .issue-195-work/candidates

      - uses: actions/upload-artifact@v7
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  consumers:
    name: Clean Consumer (${{ matrix.os }})
    needs: candidates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: issue-195-consumer-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio with C++ tools not found"
          }
          $vcvars = Join-Path $installationPath "VC\Auxiliary\Build\vcvars64.bat"
          $vcvarsEnvironment = @{}
          $existingPath = $env:Path -split ";" | Where-Object { $_ }
          cmd /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match "^(.*?)=(.*)$") {
              $name = $matches[1]
              $value = $matches[2]
              $vcvarsEnvironment[$name] = $value
              if ($name -eq "Path") {
                # GITHUB_PATH prepends to the existing PATH; a Path entry in GITHUB_ENV would add a
                # second, differently cased variable that child processes may resolve instead.
                # Only the directories vcvars added are prepended: re-prepending the runner's own
                # entries would put WindowsApps (whose bash.exe is the WSL launcher) ahead of Git Bash.
                $value -split ";" | Where-Object { $_ -and ($existingPath -notcontains $_) } | ForEach-Object {
                  $_ | Out-File -FilePath $env:GITHUB_PATH -Append
                }
              } elseif ($name -match "^(INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsVersion|VSINSTALLDIR|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion)$") {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append
              }
            }
          }
          $msvcLinker = Join-Path $vcvarsEnvironment["VCToolsInstallDir"] "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path $msvcLinker)) {
            throw "MSVC link.exe not found at $msvcLinker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$msvcLinker" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Install and parse the exact artifacts in clean consumers
        shell: bash
        run: >-
          node js/scripts/run-issue-195-consumer.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-consumer"
          --out issue-195-artifacts/platform/report.json

      # The delivery gate: every retained item is current or at its verified
      # newest compatible release, and the clean consumer resolves the audited
      # npm releases. A pull request compares offline against the committed
      # audit; the live registries change outside the pull request.
      - name: Check delivered dependencies against the committed audit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: >-
          node js/scripts/check-dependencies.mjs --delivery --offline
          --consumer-lock "$RUNNER_TEMP/issue-195-consumer/npm-consumer/package-lock.json"

      # Post-merge report: a release published after the audit date is moved to
      # by the scheduled dependency refresh, never by failing a check.
      - name: Compare the delivered dependencies with the live registries
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node js/scripts/check-dependencies.mjs --delivery --live
          --consumer-lock "$RUNNER_TEMP/issue-195-consumer/npm-consumer/package-lock.json"

      - uses: actions/upload-artifact@v7
        with:
          name: issue-195-platform-${{ matrix.os }}-${{ github.sha }}
          path: issue-195-artifacts/platform/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload consumer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-consumer-logs-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/issue-195-consumer/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-consumer/crate-target"

  rml-workloads:
    name: Relative Meta Logic Workloads
    needs: candidates
    runs-on: ubuntu-latest
    # theory-network.test.mjs alone takes minutes, and the Rust workloads build RML from scratch.
    timeout-minutes: 90
    concurrency:
      group: issue-195-rml-workloads-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Run the relative-meta-logic pull request 184 workloads on the exact artifacts
        shell: bash
        run: >-
          node js/scripts/run-rml-pr184-workloads.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-rml-workloads"
          --out issue-195-artifacts/rml-workloads/report.json

      # The report is uploaded even when a workload fails: the aggregate validates it and
      # records nothing for the assertions it does not support.
      - name: Upload the workload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-rml-workloads-${{ github.sha }}
          path: issue-195-artifacts/rml-workloads/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload workload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-rml-workload-logs-${{ github.sha }}
          path: ${{ runner.temp }}/issue-195-rml-workloads/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-rml-workloads/rml-target"

  formal-ai-workloads:
    name: Formal AI Workloads
    needs: candidates
    runs-on: ubuntu-latest
    # The Rust workloads build formal-ai and its dependencies from scratch.
    timeout-minutes: 120
    concurrency:
      group: issue-195-formal-ai-workloads-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Run the link-assistant/formal-ai workloads on the exact artifacts
        shell: bash
        run: >-
          node js/scripts/run-formal-ai-workloads.mjs
          --npm-tarball "$(ls .issue-195-work/candidates/*.tgz)"
          --crate "$(ls .issue-195-work/candidates/*.crate)"
          --work-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads"
          --out issue-195-artifacts/formal-ai-workloads/report.json

      # The report is uploaded even when a workload fails: the aggregate validates it and
      # records nothing for the assertions it does not support.
      - name: Upload the workload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-workloads-${{ github.sha }}
          path: issue-195-artifacts/formal-ai-workloads/report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload workload logs and runtime outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-formal-ai-workload-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/issue-195-formal-ai-workloads/*.log
            ${{ runner.temp }}/issue-195-formal-ai-workloads/*-outputs.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: node scripts/clean-caches.mjs --event ci-teardown --target-dir "$RUNNER_TEMP/issue-195-formal-ai-workloads/formal-ai-target"

  # The checkpoint evidence runs as separate stage jobs (js/scripts/issue-195-evidence-stages.mjs),
  # each on its own runner with only the toolchains it uses, and each uploading
  # its record. The Full Requirements Aggregate only merges and evaluates them.
  runtime-parity:
    name: Evidence Stage (runtime-parity)
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-runtime-parity-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Compare the JavaScript and Rust runtimes
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage runtime-parity

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  native-translations:
    name: Evidence Stage (native-${{ matrix.target }})
    needs: runtime-parity
    # A failed runtime-parity stage still uploads its record; this stage then
    # records why it has no translations to validate.
    if: ${{ !cancelled() && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-stage-native-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [javascript, rust, lean, rocq]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup Lean
        if: ${{ matrix.target == 'lean' }}
        env:
          ELAN_HOME: ${{ runner.temp }}/elan-home
          ELAN_VERSION: v4.2.4
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          archive="${RUNNER_TEMP}/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          echo "${ELAN_HOME}/bin" >> "$GITHUB_PATH"
          "${ELAN_HOME}/bin/lean" --version

      - name: Setup OCaml
        if: ${{ matrix.target == 'rocq' }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          opam-pin: false

      - name: Install Rocq 9.3
        if: ${{ matrix.target == 'rocq' }}
        run: |
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam install --yes 'rocq-core=9.3.0' 'rocq-stdlib=9.2.0' 'rocq-prover=meta.1'
          opam var bin >> "$GITHUB_PATH"
          opam exec -- rocq --version

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download the runtime-parity stage outputs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-stage-runtime-parity-${{ github.sha }}
          path: issue-195-results

      - name: Validate the emitted translations with the native toolchain
        env:
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          TARGET: native-${{ matrix.target }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$TARGET"

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  evidence-stages:
    name: Evidence Stage (${{ matrix.stage }})
    needs: [candidates, consumers, rml-workloads, formal-ai-workloads]
    if: ${{ !cancelled() && needs.candidates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ endsWith(matrix.stage, '-suite') && 60 || 30 }}
    concurrency:
      group: issue-195-stage-${{ github.ref }}-${{ matrix.stage }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(github.event_name == 'release' && '["delivery"]' || '["javascript-suite","rust-suite","delivery"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Setup Lean
        if: ${{ endsWith(matrix.stage, '-suite') }}
        env:
          ELAN_HOME: ${{ runner.temp }}/elan-home
          ELAN_VERSION: v4.2.4
          ELAN_ARCHIVE_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          archive="${RUNNER_TEMP}/elan-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          echo "${ELAN_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "${RUNNER_TEMP}/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.1
          echo "${ELAN_HOME}/bin" >> "$GITHUB_PATH"
          "${ELAN_HOME}/bin/lean" --version

      - name: Setup OCaml
        if: ${{ endsWith(matrix.stage, '-suite') }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
          opam-pin: false

      - name: Install Rocq 9.3
        if: ${{ endsWith(matrix.stage, '-suite') }}
        run: |
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam install --yes 'rocq-core=9.3.0' 'rocq-stdlib=9.2.0' 'rocq-prover=meta.1'
          opam var bin >> "$GITHUB_PATH"
          opam exec -- rocq --version

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Download delivery candidates
        if: ${{ matrix.stage == 'delivery' }}
        uses: actions/download-artifact@v8
        with:
          name: issue-195-candidates-${{ github.sha }}
          path: .issue-195-work/candidates

      - name: Download platform consumer reports
        if: ${{ matrix.stage == 'delivery' }}
        uses: actions/download-artifact@v8
        with:
          pattern: issue-195-platform-*-${{ github.sha }}
          path: issue-195-artifacts/platform-reports

      - name: Download the relative-meta-logic workload report
        # A missing report leaves I195-DOWNSTREAM-RML-WORKLOADS unobserved instead of stopping the stage.
        if: ${{ endsWith(matrix.stage, '-suite') }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-rml-workloads-${{ github.sha }}
          path: issue-195-artifacts/rml-workloads

      - name: Download the formal-ai workload report
        # A missing report leaves I195-DOWNSTREAM-FORMAL-AI-WORKLOADS unobserved instead of stopping the stage.
        if: ${{ endsWith(matrix.stage, '-suite') }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: issue-195-formal-ai-workloads-${{ github.sha }}
          path: issue-195-artifacts/formal-ai-workloads

      - name: Produce the stage evidence
        env:
          ISSUE_195_RML_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/rml-workloads/report.json
          ISSUE_195_FORMAL_AI_WORKLOAD_REPORT: ${{ github.workspace }}/issue-195-artifacts/formal-ai-workloads/report.json
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
          STAGE: ${{ matrix.stage }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --stage "$STAGE"
          --candidates .issue-195-work/candidates
          --platform-reports issue-195-artifacts/platform-reports

      # The record, execution records, logs and artifacts are uploaded even when
      # the stage fails: the aggregate reports the failure as one gate error.
      - name: Upload the stage outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-stage-${{ matrix.stage }}-${{ github.sha }}
          path: |
            issue-195-results/work/stage-*
            issue-195-results/work/native/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown

  # Post-merge checks run on main only, as a non-blocking report: the live
  # default-branch rules exist outside any pull request, so no pull request
  # check depends on them, and a failure here is fixed in a follow-up commit.
  post-merge:
    name: Post-merge Report
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-post-merge-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Inspect the default-branch rules with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint post-merge
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results

      - name: Evaluate the post-merge cells
        if: ${{ !cancelled() }}
        run: >-
          node js/scripts/check-issue-195-acceptance.mjs
          --evaluate
          --checkpoint post-merge
          --results-dir issue-195-results
          --json-report issue-195-artifacts/post-merge-report.json
          --markdown-report issue-195-artifacts/post-merge-report.md

      - name: Publish the post-merge report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-post-merge-report-${{ github.sha }}
          path: |
            issue-195-artifacts/
            issue-195-results/logs/
            issue-195-results/artifacts/
          if-no-files-found: warn
          retention-days: 30

  acceptance:
    name: Full Requirements Aggregate
    needs: [candidates, consumers, rml-workloads, formal-ai-workloads, runtime-parity, native-translations, evidence-stages]
    # GitHub reports a skipped job as a successful required check. This job
    # always runs and fails itself when there are no candidates to evaluate.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: issue-195-acceptance-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Require delivery candidates
        if: ${{ needs.candidates.result != 'success' }}
        env:
          CANDIDATES_RESULT: ${{ needs.candidates.result }}
        run: |
          echo "::error::Delivery Candidates finished as '${CANDIDATES_RESULT}'; the Full Requirements Aggregate cannot pass without them"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
        working-directory: js

      - name: Validate atomic manifest and protected scope baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.release.target_commitish }}
          ISSUE_195_SCOPE_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'issue-195-scope-change-approved') }}
        run: node js/scripts/check-issue-195-acceptance.mjs --scope-baseline "$BASELINE_SHA"

      # A stage whose job failed before uploading has no record here; the
      # aggregate reports it as one gate error naming the stage.
      - name: Download the evidence stage outputs
        uses: actions/download-artifact@v8
        with:
          pattern: issue-195-stage-*-${{ github.sha }}
          path: issue-195-results
          merge-multiple: true

      - name: Merge the evidence stages
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/run-issue-195-evidence.mjs
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --commit "$GITHUB_SHA"
          --results-dir issue-195-results
          --aggregate

      - name: Evaluate every required verification cell
        if: ${{ always() && needs.candidates.result == 'success' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          ACCEPTANCE_CHECKPOINT: ${{ github.event_name == 'release' && 'release-delivery' || 'pre-merge' }}
        run: >-
          node js/scripts/check-issue-195-acceptance.mjs
          --produce-gate-results issue-195-results/gate-faults.json
          --evaluate
          --checkpoint "$ACCEPTANCE_CHECKPOINT"
          --results-dir issue-195-results
          --json-report issue-195-artifacts/report.json
          --markdown-report issue-195-artifacts/report.md

      - name: Publish per-requirement evidence report
        if: ${{ always() && needs.candidates.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-195-requirement-report-${{ github.sha }}
          path: |
            issue-195-artifacts/
            issue-195-results/logs/
            issue-195-results/artifacts/
            issue-195-results/runtime-parity/
            issue-195-results/work/native/
          if-no-files-found: error
          retention-days: 30

      - name: Clean regenerable caches
        if: ${{ !cancelled() && hashFiles('scripts/clean-caches.mjs') != '' }}
        working-directory: ${{ github.workspace }}
        run: node scripts/clean-caches.mjs --event ci-teardown
