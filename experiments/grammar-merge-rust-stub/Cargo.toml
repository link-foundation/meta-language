[package]
name = "grammar-merge-rust-stub"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone probe: compiles rust/src/grammar/merge/ against a copy of the
# grammar IR with the crate's clippy configuration, without building the whole
# meta-language crate. Regenerate the IR copy with build-stub.sh.

[lib]
# The facade exposes the names rust/tests/unit/grammar_merge.rs imports, so the
# real test file runs against the stub (tests/probe.rs).
name = "meta_language"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
